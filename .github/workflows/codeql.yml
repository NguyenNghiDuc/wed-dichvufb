name: CodeQL security analysis

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main, 'feature/**']
  schedule:
    - cron: '19 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  java-security:
    name: Analyze Java security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: java-kotlin
          queries: security-extended,security-and-quality
          build-mode: manual
      - name: Compile application and isolated CSRF reproduction for analysis
        run: |
          mvn -B --no-transfer-progress -DskipTests package
          mvn -B --no-transfer-progress -f tools/codeql-csrf-repro/pom.xml verify
      - id: analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: '/language:java-kotlin'
          output: ${{ runner.temp }}/codeql-sarif-raw
          post-processed-sarif-path: ${{ runner.temp }}/codeql-sarif-postprocessed
      - name: Preserve raw and uploaded SARIF for issue #13
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: codeql-sarif-triage-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/codeql-sarif-raw
            ${{ runner.temp }}/codeql-sarif-postprocessed
          if-no-files-found: warn
          retention-days: 14

  csrf-minimal-repro:
    name: Isolated CSRF reproduction (SARIF only; upload disabled)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chore/codeql-action-4.39.1-coordinated-20261115'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: java-kotlin
          queries: security-extended,security-and-quality
          build-mode: manual
      - name: Compile only the isolated CSRF reproduction
        run: mvn -B --no-transfer-progress -f tools/codeql-csrf-repro/pom.xml verify
      - id: analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          upload: never
          category: '/language:java-kotlin/csrf-repro-isolated'
          output: ${{ runner.temp }}/codeql-csrf-isolated-sarif
      - name: Fail closed when the fixture CSRF result is missing from SARIF
        if: steps.analyze.outcome == 'success'
        env:
          SARIF_DIR: ${{ runner.temp }}/codeql-csrf-isolated-sarif
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          target = "java/csrf-unprotected-request-type"
          root = Path(os.environ["SARIF_DIR"])
          files = sorted(root.rglob("*.sarif")) if root.exists() else []
          if not files:
              print(f"::error::No fixture SARIF file found under {root}")
              sys.exit(1)

          definition_found = False
          result_count = 0
          for path in files:
              try:
                  document = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as error:
                  print(f"::error::Cannot read SARIF {path}: {error}")
                  sys.exit(1)
              if document.get("version") != "2.1.0":
                  print(f"::error::Unexpected SARIF version in {path}: {document.get('version')}")
                  sys.exit(1)
              for run in document.get("runs", []):
                  tool = run.get("tool", {})
                  driver = tool.get("driver", {})
                  driver_rules = driver.get("rules", [])
                  components = [driver, *tool.get("extensions", [])]
                  rule_ids = {
                      rule.get("id")
                      for component in components
                      for rule in component.get("rules", [])
                  }
                  definition_found = definition_found or target in rule_ids
                  for result in run.get("results", []):
                      rule_id = result.get("ruleId")
                      if rule_id is None:
                          index = result.get("ruleIndex")
                          if isinstance(index, int) and 0 <= index < len(driver_rules):
                              rule_id = driver_rules[index].get("id")
                      if rule_id == target:
                          result_count += 1

          if not definition_found:
              print(f"::error::SARIF does not contain the expected query definition in the driver or extensions: {target}")
              sys.exit(1)
          if result_count == 0:
              print(f"::error::The fixture query definition is present, but {target} produced no SARIF result. Inspect CodeQL path-graph exporter errors; a green analyze step is not sufficient evidence.")
              sys.exit(1)
          print(f"Validated {result_count} SARIF result(s) for {target} across {len(files)} file(s).")
          PY
      - name: Preserve fixture-only SARIF without publishing alerts
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: codeql-csrf-isolated-${{ github.run_id }}
          path: ${{ runner.temp }}/codeql-csrf-isolated-sarif
          if-no-files-found: warn
          retention-days: 14
