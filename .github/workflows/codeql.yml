name: CodeQL security analysis

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main, 'feature/**']
  schedule:
    - cron: '19 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  java-security:
    name: Analyze Java security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: java-kotlin
          queries: security-extended,security-and-quality
          build-mode: manual
      - name: Compile application for analysis
        run: mvn -B --no-transfer-progress -DskipTests package
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: '/language:java-kotlin'
