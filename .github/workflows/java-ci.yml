name: Java CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main, 'feature/**']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: growlab_ci
          POSTGRES_USER: growlab
          POSTGRES_PASSWORD: testpass
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U growlab -d growlab_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run unit and PostgreSQL integration tests
        run: mvn -B --no-transfer-progress clean verify
      - name: Publish test coverage for review
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: warn
          retention-days: 7
      # Safe CI-only restore rehearsal: seeded test database, never a production instance.
      - name: PostgreSQL backup and isolated restore smoke
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=testpass \
            -v "$RUNNER_TEMP:/backups" postgres:16-alpine sh -ec '
              pg_dump -h 127.0.0.1 -U growlab -d growlab_ci --format=custom -f /backups/ci-postgres.dump
              pg_restore --list /backups/ci-postgres.dump >/dev/null
              createdb -h 127.0.0.1 -U growlab growlab_restore
              pg_restore -h 127.0.0.1 -U growlab --no-owner --no-privileges -d growlab_restore /backups/ci-postgres.dump
              psql -h 127.0.0.1 -U growlab -d growlab_restore -v ON_ERROR_STOP=1 -Atc "SELECT COUNT(*) FROM payment_receipts" | grep -Eq "^[0-9]+$"
              psql -h 127.0.0.1 -U growlab -d growlab_restore -v ON_ERROR_STOP=1 -Atc "SELECT COUNT(*) FROM flyway_schema_history" | grep -Eq "^[1-9][0-9]*$"
            '
          rm -f "$RUNNER_TEMP/ci-postgres.dump"
      - name: Package application
        run: test -f target/fbservice-0.0.1-SNAPSHOT.jar
      - name: Launch production JAR smoke test
        env:
          SPRING_PROFILES_ACTIVE: prod
          DB_URL: jdbc:postgresql://localhost:5432/growlab_ci
          DB_USERNAME: growlab
          DB_PASSWORD: testpass
        run: |
          java -jar target/fbservice-0.0.1-SNAPSHOT.jar >/tmp/growlab-startup.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" || true' EXIT
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8080/actuator/health >/tmp/health.json; then break; fi
            sleep 2
          done
          grep -q 'UP' /tmp/health.json || { cat /tmp/growlab-startup.log; exit 1; }
          curl -fsS http://127.0.0.1:8080/ | grep -q GrowLab
          curl -fsS http://127.0.0.1:8080/register | grep -q csrf
      - name: Validate Docker image
        run: docker build -t growlab-ci:latest .
