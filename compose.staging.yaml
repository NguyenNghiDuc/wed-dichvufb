# W10 staging-only overlay. Do NOT run against production hosts or data.
# Use only after DNS, TLS, credentials and owner approval are ready.
# docker compose -f compose.yaml -f compose.staging.yaml config --quiet
services:
  db:
    networks: [db_private]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  app:
    networks: [db_private, web_private]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    init: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 35s
    environment:
      SPRING_PROFILES_ACTIVE: prod
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  proxy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      STAGING_HOST: ${STAGING_HOST:?Set an approved staging DNS name; NEVER production without authorization}
    volumes:
      - ./ops/Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web_private]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=32m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    pids_limit: 128
    mem_limit: 192m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  db_private:
    internal: true
  web_private: {}
volumes:
  caddy_data: {}
  caddy_config: {}
