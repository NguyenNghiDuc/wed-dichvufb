# Development only. PostgreSQL and Flyway are required in production.
spring.application.name=GrowLab
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/fbdb}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.h2.console.enabled=false
spring.thymeleaf.cache=false
server.error.include-message=never
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
growth.youtube.api-key=${YOUTUBE_API_KEY:}
growth.ai.api-key=${GROWTH_AI_API_KEY:}
growth.ai.model=${GROWTH_AI_MODEL:gpt-4o-mini}
growth.payments.webhook-secret=${GROWTH_WEBHOOK_SECRET:}

# Operational deadlines only (not guaranteed customer delivery dates).
growth.sla.review-hours=${GROWTH_SLA_REVIEW_HOURS:24}
growth.sla.execution-hours=${GROWTH_SLA_EXECUTION_HOURS:72}
growth.sla.alerts-enabled=${GROWTH_SLA_ALERTS_ENABLED:false}
growth.sla.scan-ms=${GROWTH_SLA_SCAN_MS:3600000}
