# Development only. PostgreSQL and Flyway are required in production.
spring.application.name=GrowLab
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/fbdb}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.h2.console.enabled=false
spring.thymeleaf.cache=false
server.error.include-message=never
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
growth.youtube.api-key=${YOUTUBE_API_KEY:}
growth.ai.api-key=${GROWTH_AI_API_KEY:}
growth.ai.model=${GROWTH_AI_MODEL:gpt-4o-mini}
growth.payments.webhook-secret=${GROWTH_WEBHOOK_SECRET:}
# This does NOT connect to Techcombank. Enable only for an approved bank/PSP adapter.
growth.payments.bank.account-number=${GROWTH_BANK_ACCOUNT_NUMBER:}
growth.payments.bank.account-holder=${GROWTH_BANK_ACCOUNT_HOLDER:}
growth.payments.bank-webhook-secret=${GROWTH_BANK_SETTLEMENT_SECRET:}
# Explicit opt-in required for existing internal synthetic settlement route (disabled in production).
growth.payments.internal-verified-enabled=${GROWTH_INTERNAL_VERIFIED_ENABLED:false}
# Casso V2 signed webhook: enable only after linking Techcombank and verifying real transactions.
growth.payments.casso.enabled=${GROWTH_CASSO_ENABLED:false}
growth.payments.casso.webhook-secret=${GROWTH_CASSO_WEBHOOK_SECRET:}
# Separate rollout switch: do not show QR or credit wallets before staging + provider acceptance.
growth.payments.live-ready=${GROWTH_LIVE_PAYMENTS_READY:false}

# Session IDs are accepted only in cookies; idle sessions expire after 30 minutes.
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=none
