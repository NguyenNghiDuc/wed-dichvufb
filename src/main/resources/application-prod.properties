# Fail closed unless a PostgreSQL JDBC URL and credentials are provided.
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.h2.console.enabled=false
spring.thymeleaf.cache=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=framework

# W10 staging/production safety: no detailed actuator/exception output to clients.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
# Controlled shutdown lets reverse proxies remove a node before stopping active requests.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s
spring.jpa.open-in-view=false
# Keep potentially sensitive request/SQL values out of production logs.
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
server.tomcat.accesslog.enabled=false
