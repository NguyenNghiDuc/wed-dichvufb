<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đổi mật khẩu · GrowLab</title><link rel="stylesheet" th:href="@{/style.css}"></head>
<body><header class="topbar"><nav class="nav container"><a class="brand" th:href="@{/}"><span class="brand-icon">↗</span>Grow<strong>Lab</strong></a></nav></header>
<main class="page container"><a class="table-link" th:href="@{/profile}">← Hồ sơ của tôi</a>
<section class="form-panel narrow">
<div class="eyebrow">Bảo mật tài khoản</div><h1>Đổi mật khẩu</h1>
<p class="muted">Xác minh mật khẩu hiện tại trước khi thay đổi. Tất cả phiên đăng nhập cũ sẽ hết hiệu lực.</p>
<p class="error" th:if="${error}" th:text="${error}"></p>
<form method="post" th:action="@{/account/password}" autocomplete="off">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<div class="field"><label for="currentPassword">Mật khẩu hiện tại</label><input id="currentPassword" type="password" name="currentPassword" autocomplete="current-password" required></div>
<div class="field"><label for="newPassword">Mật khẩu mới</label><input id="newPassword" type="password" name="newPassword" autocomplete="new-password" minlength="12" required><small>Ít nhất 12 ký tự, tối đa 72 byte UTF-8.</small></div>
<div class="field"><label for="confirmPassword">Nhập lại mật khẩu mới</label><input id="confirmPassword" type="password" name="confirmPassword" autocomplete="new-password" minlength="12" required></div>
<button class="btn full" type="submit">Lưu mật khẩu mới</button>
</form></section></main></body></html>
