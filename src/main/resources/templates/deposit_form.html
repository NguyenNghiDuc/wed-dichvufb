<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Yêu cầu nạp tiền · GrowLab</title><link rel="stylesheet" th:href="@{/style.css}"><script defer th:src="@{/site.js}"></script></head><body class="account-page"><header th:replace="~{fragments/site_layout :: header}"></header><main class="page container" id="page-content" tabindex="-1"><div class="page-header"><h1>Tạo yêu cầu nạp tiền</h1><a class="btn btn-outline" th:href="@{/deposit/list}">Lịch sử yêu cầu</a></div><div class="form-panel"><div class="notice">Chức năng này chỉ lưu yêu cầu. Chưa tích hợp cổng thanh toán, không tự ghi có số dư. Không chuyển tiền dựa vào thông tin từ giao diện thử nghiệm.</div><p class="error" role="alert" th:if="${error}" th:text="${error}"></p><form method="post" th:action="@{/deposit/create}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="field"><label>Số tiền (VND)</label><input type="number" name="amount" th:value="${deposit.amount}" min="1000" max="1000000000" required></div><div class="field"><label>Ghi chú</label><textarea name="note" th:text="${deposit.note}" maxlength="255"></textarea></div><button class="btn" type="submit">Gửi yêu cầu</button></form></div></main></body></html>
