<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chỉnh sửa hồ sơ · GrowLab</title><link rel="stylesheet" th:href="@{/style.css}"></head>
<body><main class="page container">
<a class="table-link" th:href="@{/profile}">← Hồ sơ cá nhân</a>
<div class="page-header"><div><div class="eyebrow">Thông tin liên hệ</div><h1>Chỉnh sửa hồ sơ</h1>
<p class="muted">Chỉ thay đổi tên hiển thị và số điện thoại liên hệ. Email, vai trò và mật khẩu không thay đổi.</p></div></div>
<section class="form-panel">
<div class="error" th:if="${error}" th:text="${error}"></div>
<form th:action="@{/profile/edit}" method="post">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<div class="field"><label for="displayName">Tên hiển thị</label>
<input id="displayName" name="displayName" maxlength="80" minlength="2" required
       autocomplete="name" th:value="${profile.displayName()}"></div>
<div class="field"><label for="phone">Điện thoại liên hệ (không bắt buộc)</label>
<input id="phone" name="phone" maxlength="20" inputmode="tel" autocomplete="tel"
       th:value="${profile.phone()}"></div>
<button class="btn" type="submit">Lưu thay đổi</button>
</form>
</section></main></body></html>
