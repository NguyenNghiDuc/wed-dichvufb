<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đăng ký · GrowLab</title><link rel="stylesheet" th:href="@{/style.css}"><script defer th:src="@{/site.js}"></script></head><body class="account-page">
<header th:replace="~{fragments/site_layout :: header}"></header>
<main class="page container" id="page-content" tabindex="-1"><section class="form-panel narrow"><div class="eyebrow">Bắt đầu cùng GrowLab</div><h2>Tạo tài khoản</h2><p th:if="${error}" class="error" th:text="${error}"></p>
<form method="post" th:action="@{/register}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="field"><label for="username">Tên đăng nhập</label><input id="username" name="username" th:value="${registerUsername}" pattern="[a-zA-Z0-9._\-]{3,40}" minlength="3" maxlength="40" required autocomplete="username"></div><div class="field"><label for="email">Email (tùy chọn)</label><input id="email" th:value="${registerEmail}" type="email" name="email" maxlength="255" autocomplete="email"></div><div class="field"><label for="password">Mật khẩu</label><input id="password" type="password" name="password" minlength="8" maxlength="72" required autocomplete="new-password"><small>Ít nhất 8 ký tự; tối đa 72 byte UTF-8.</small></div><button type="submit" class="btn full">Đăng ký miễn phí →</button></form><p class="footnote">Đã có tài khoản? <a class="table-link" th:href="@{/login}">Đăng nhập</a></p></section></main></body></html>
