<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đăng ký · GrowLab</title><link rel="stylesheet" th:href="@{/style.css}"><script defer th:src="@{/site.js(v=20261018-auth-native)}"></script></head><body class="auth-page">
<a class="site-skip" href="#page-content">Đến nội dung</a>
<main class="auth-shell" id="page-content" tabindex="-1"><section class="auth-main"><div class="auth-form"><a class="auth-brand" th:href="@{/}" aria-label="GrowLab — Trang chủ">Grow<span>Lab</span><i aria-hidden="true">✦</i><small>SOCIAL GROWTH STUDIO</small></a><div class="auth-eyebrow">Bắt đầu cùng GrowLab</div><h1>Khởi đầu điều tuyệt vời.</h1><p class="muted">Một tài khoản, mọi công cụ để phát triển thương hiệu.</p><p th:if="${error}" class="error" role="alert" th:text="${error}"></p>
<form method="post" th:action="@{/register}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="field"><label for="username">Tên đăng nhập</label><input placeholder="Tên đăng nhập của bạn" id="username" name="username" th:value="${registerUsername}" pattern="[a-zA-Z0-9._\-]{3,40}" minlength="3" maxlength="40" required autocomplete="username"></div><div class="field"><label for="email">Email (tùy chọn)</label><input placeholder="ban@example.com" id="email" th:value="${registerEmail}" type="email" name="email" maxlength="255" autocomplete="email"></div><div class="field"><label for="password">Mật khẩu</label><input placeholder="Nhập mật khẩu" id="password" type="password" name="password" minlength="8" maxlength="72" required autocomplete="new-password"><small>Ít nhất 8 ký tự; tối đa 72 byte UTF-8.</small></div><button type="submit" class="btn full">Đăng ký miễn phí →</button></form><p class="footnote">Đã có tài khoản? <a class="table-link" th:href="@{/login}">Đăng nhập</a></p><a class="auth-back" th:href="@{/}">← Về trang chủ</a></div></section><aside th:replace="~{fragments/auth_visual :: visual}"></aside></main></body></html>
