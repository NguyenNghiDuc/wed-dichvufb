<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin hỗ trợ · GrowLab</title><link rel="stylesheet" th:href="@{/style.css}"></head>
<body><main class="page container"><a th:href="@{/admin/support}" class="table-link">← Tất cả yêu cầu</a>
<div class="page-header"><div><div class="eyebrow">Admin</div><h1 th:text="${ticket.subject}"></h1><p class="muted" th:text="|Tài khoản: ${ticket.ownerUsername}|"></p><span class="status" th:text="${ticket.status.title}"></span></div></div>
<article class="card"><p th:text="${ticket.description}"></p>
<p>Ưu tiên: <strong th:text="${ticket.priority.title}"></strong></p>
<form method="post" th:if="${ticket.status.name() != 'CLOSED'}"
      th:action="@{/admin/support/{id}/priority(id=${ticket.id})}" class="actions">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<label for="supportPriority">Độ ưu tiên</label>
<select id="supportPriority" name="priority">
<option th:each="p : ${T(com.example.fbservice.support.TicketPriority).values()}" th:value="${p.name()}" th:text="${p.title}" th:selected="${p == ticket.priority}"></option>
</select>
<button class="btn btn-small" type="submit">Lưu ưu tiên</button></form></article>
<section class="section"><h2>Lịch sử phản hồi</h2><article class="card" th:each="m : ${messages}"><b th:text="${m.author}"></b><p th:text="${m.body}"></p></article>
<nav class="actions" aria-label="Phân trang phản hồi">
 <a class="btn btn-outline btn-small" th:if="${hasPrevious}" th:href="@{/admin/support/{id}(id=${ticket.id},page=${messagePage - 1})}">← Trang trước</a>
 <span class="muted" th:text="|Trang ${messagePage + 1}|">Trang 1</span>
 <a class="btn btn-outline btn-small" th:if="${hasNext}" th:href="@{/admin/support/{id}(id=${ticket.id},page=${messagePage + 1})}">Trang sau →</a>
 </nav><div class="form-panel" th:if="${ticket.status.name() != 'CLOSED'}"><p class="error" th:if="${error}" th:text="${error}"></p><form method="post" th:action="@{/admin/support/{id}/reply(id=${ticket.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="field"><label>Trả lời khách hàng</label><textarea name="message" required minlength="2" maxlength="2000"></textarea></div><button class="btn" type="submit">Gửi trả lời</button></form>
<form method="post" th:action="@{/admin/support/{id}/close(id=${ticket.id})}" class="mt-3"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-outline" type="submit">Đóng yêu cầu</button></form></div></section></main></body></html>
