<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin hỗ trợ · GrowLab</title><link rel="stylesheet" th:href="@{/style.css}"><script defer th:src="@{/site.js}"></script></head>
<body class="account-page"><header th:replace="~{fragments/site_layout :: header}"></header><main class="page container support-conversation" id="page-content" tabindex="-1"><a th:href="@{/admin/support}" class="table-link">← Tất cả yêu cầu</a>
<div class="page-header"><div><div class="eyebrow">Admin</div><h1 th:text="${ticket.subject}"></h1><p class="muted" th:text="|Tài khoản: ${ticket.ownerUsername}|"></p><span class="status" th:text="${ticket.status.title}"></span></div></div>
<p class="success-message" th:if="${success}" role="status" th:text="${success}"></p><article class="card"><p th:text="${ticket.description}"></p></article>
<p class="error" role="alert" th:if="${error}" th:text="${error}"></p><section class="section"><h2>Lịch sử phản hồi</h2><article class="card support-message" th:each="m : ${messages}" th:classappend="${m.author == ticket.ownerUsername ? 'message-customer' : 'message-staff'}"><span class="message-role" th:text="${m.author == ticket.ownerUsername ? 'Khách hàng' : 'Nhân viên hỗ trợ'}"></span><b th:text="${m.author}"></b><p th:text="${m.body}"></p><p class="footnote" th:text="${#temporals.format(m.createdAt,'dd/MM/yyyy HH:mm') + ' UTC'}"></p></article>
<div class="form-panel" th:if="${ticket.status.name() != 'CLOSED'}"><form method="post" th:action="@{/admin/support/{id}/reply(id=${ticket.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="field"><label>Trả lời khách hàng</label><textarea name="message" th:text="${inputMessage}" required minlength="2" maxlength="2000"></textarea></div><button class="btn" type="submit">Gửi trả lời</button></form>
<form method="post" th:action="@{/admin/support/{id}/close(id=${ticket.id})}" class="mt-3" data-confirm="Đóng yêu cầu hỗ trợ này?"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-outline" type="submit">Đóng yêu cầu</button></form></div><section class="form-panel support-reopen" th:if="${ticket.status.name() == 'CLOSED'}"><span class="deposit-tag">YÊU CẦU ĐÃ ĐÓNG</span><h2>Bạn cần trao đổi thêm?</h2><p class="muted">Mở lại phiếu này để giữ nguyên toàn bộ lịch sử hỗ trợ.</p><form method="post" th:action="@{/admin/support/{id}/reopen(id=${ticket.id})}"><div class="field"><label for="reopen-reason">Lý do mở lại</label><textarea id="reopen-reason" name="reason" minlength="10" maxlength="1900" rows="3" th:text="${inputReason}" placeholder="Mô tả thông tin mới hoặc vấn đề chưa được giải quyết" required></textarea></div><button class="btn" type="submit">Mở lại yêu cầu →</button></form></section></section></main></body></html>
