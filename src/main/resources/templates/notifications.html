<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thông báo · GrowLab</title>
<link rel="stylesheet" th:href="@{/style.css}">
<link rel="stylesheet" th:href="@{/notifications.css}">
</head>
<body>
<main class="page container notifications-page">
<a class="table-link" th:href="@{/campaigns}">← Chiến dịch của tôi</a>
<div class="page-header">
  <div>
    <div class="eyebrow">Notifications</div>
    <h1>Thông báo của tôi</h1>
    <p class="muted">Chưa đọc: <strong th:text="${unread}">0</strong></p>
  </div>
</div>
<div class="notification-tools">
  <nav class="actions" aria-label="Lọc thông báo">
    <a class="btn btn-small" th:classappend="${!unreadOnly} ? '' : ' btn-outline'"
       th:href="@{/notifications(days=${days},q=${q})}">Tất cả</a>
    <a class="btn btn-small" th:classappend="${unreadOnly} ? '' : ' btn-outline'"
       th:href="@{/notifications(unreadOnly=true,days=${days},q=${q})}">Chưa đọc</a>
  </nav>
  <form method="get" th:action="@{/notifications}" aria-label="Lọc theo thời gian">
    <input type="hidden" name="unreadOnly" th:value="${unreadOnly}">
    <input type="hidden" name="q" th:value="${q}">
    <label for="notification-days">Thời gian</label>
    <select id="notification-days" name="days">
      <option value="0" th:selected="${days == 0}">Tất cả</option>
      <option value="7" th:selected="${days == 7}">7 ngày gần đây</option>
      <option value="30" th:selected="${days == 30}">30 ngày gần đây</option>
      <option value="90" th:selected="${days == 90}">90 ngày gần đây</option>
    </select>
    <button class="btn btn-outline btn-small" type="submit">Áp dụng</button>
  </form>
  <form method="get" th:action="@{/notifications}" role="search" aria-label="Tìm kiếm thông báo">
    <input type="hidden" name="days" th:value="${days}">
    <input type="hidden" name="unreadOnly" th:value="${unreadOnly}">
    <label for="notification-query">Tìm nội dung</label>
    <input id="notification-query" type="search" name="q" maxlength="80"
           th:value="${q}" placeholder="Tiêu đề hoặc nội dung" autocomplete="off">
    <button type="submit" class="btn btn-outline btn-small">Tìm kiếm</button>
  </form>
  <form method="post" th:if="${unread > 0}" th:action="@{/notifications/read-all}">
    <input type="hidden" name="page" th:value="${pageNumber}">
    <input type="hidden" name="unreadOnly" th:value="${unreadOnly}">
    <input type="hidden" name="days" th:value="${days}">
    <input type="hidden" name="q" th:value="${q}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button type="submit" class="btn btn-outline btn-small">Đánh dấu tất cả đã đọc</button>
  </form>
</div>
<div class="table-panel notifications-table" role="region" aria-label="Danh sách thông báo" tabindex="0"><table class="data-table">
<thead><tr><th>Ngày</th><th>Nội dung</th><th>Trạng thái</th></tr></thead>
<tbody>
<tr th:each="item : ${items}">
  <td th:text="${#temporals.format(item.createdAt,'dd/MM/yyyy HH:mm')}"></td>
  <td><a class="table-link" th:href="@{/notifications/{id}(id=${item.id},page=${pageNumber},unreadOnly=${unreadOnly},days=${days},q=${q})}"><strong th:text="${item.title}"></strong></a>
      <p class="muted" th:text="${item.message}"></p>
      <span class="status" th:text="${item.categoryLabel}">Loại</span></td>
  <td>
    <form th:if="${item.readAt == null}" method="post"
          th:action="@{/notifications/{id}/read(id=${item.id})}">
      <input type="hidden" name="page" th:value="${pageNumber}">
      <input type="hidden" name="unreadOnly" th:value="${unreadOnly}">
      <input type="hidden" name="days" th:value="${days}">
      <input type="hidden" name="q" th:value="${q}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button type="submit" class="btn btn-small">Đánh dấu đã đọc</button>
    </form>
    <span th:if="${item.readAt != null}" class="status">Đã đọc</span>
  </td>
</tr>
<tr th:if="${#lists.isEmpty(items) and !hasAnyNotifications}">
<td colspan="3" class="notification-empty">Hộp thư chưa có thông báo. Các cập nhật mới sẽ xuất hiện tại đây.</td>
</tr>
<tr th:if="${#lists.isEmpty(items) and hasAnyNotifications}">
<td colspan="3" class="notification-empty">Không có thông báo phù hợp. <a th:href="@{/notifications}">Xóa bộ lọc</a> để xem tất cả.</td>
</tr>
</tbody></table></div>
<nav class="actions" aria-label="Phân trang thông báo">
  <a class="btn btn-outline btn-small" th:if="${hasPrevious}"
     th:href="@{/notifications(page=${pageNumber - 1},unreadOnly=${unreadOnly},days=${days},q=${q})}">← Trang trước</a>
  <span class="muted" th:text="|Trang ${pageNumber + 1} / ${totalPages == 0 ? 1 : totalPages}|">Trang 1 / 1</span>
  <a class="btn btn-outline btn-small" th:if="${hasNext}"
     th:href="@{/notifications(page=${pageNumber + 1},unreadOnly=${unreadOnly},days=${days},q=${q})}">Trang sau →</a>
</nav>
</main>
</body></html>
