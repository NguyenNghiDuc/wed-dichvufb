<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thông báo · GrowLab</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><main class="page container"><a class="table-link" th:href="@{/campaigns}">← Chiến dịch</a><div class="page-header"><div><div class="eyebrow">Notifications</div><h1>Thông báo của tôi</h1><p class="muted">Chưa đọc: <b th:text="${unread}"></b></p></div></div><div class="table-panel"><table class="data-table"><thead><tr><th>Ngày</th><th>Nội dung</th><th>Trạng thái</th></tr></thead><tbody><tr th:each="item : ${items}"><td th:text="${#temporals.format(item.createdAt,'dd/MM/yyyy HH:mm')}"></td><td><b th:text="${item.title}"></b><p class="muted" th:text="${item.message}"></p></td><td><form th:if="${item.readAt==null}" method="post" th:action="@{/notifications/{id}/read(id=${item.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit" class="btn btn-small">Đã đọc</button></form><span th:if="${item.readAt!=null}" class="status">Đã đọc</span></td></tr><tr th:if="${#lists.isEmpty(items)}"><td colspan="3">Chưa có thông báo.</td></tr></tbody></table></div></main></body></html>
