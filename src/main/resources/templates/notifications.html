<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thông báo · GrowLab</title><link rel="stylesheet" th:href="@{/style.css}"><script defer th:src="@{/site.js}"></script></head><body class="account-page"><header th:replace="~{fragments/site_layout :: header}"></header><main class="page container" id="page-content" tabindex="-1"><div class="page-header"><div><div class="eyebrow">THÔNG BÁO</div><h1>Thông báo của tôi</h1><p class="muted">Chưa đọc: <b th:text="${unread}"></b></p></div><form method="post" th:action="@{/notifications/read-all}"><button class="btn" type="submit" th:disabled="${unread == 0}">Đánh dấu tất cả đã đọc</button></form></div><p th:if="${success}" class="success-message" role="status" th:text="${success}"></p><nav class="actions" aria-label="Lọc thông báo"><a class="btn btn-small" th:classappend="${unreadOnly} ? 'btn-outline' : ''" th:href="@{/notifications}">Tất cả</a><a class="btn btn-small" th:classappend="${!unreadOnly} ? 'btn-outline' : ''" th:href="@{/notifications(unreadOnly=true)}">Chưa đọc</a></nav><div class="table-panel mt-3"><table class="data-table"><thead><tr><th>Ngày</th><th>Nội dung</th><th>Trạng thái</th></tr></thead><tbody><tr th:each="item : ${items}"><td th:text="${#temporals.format(item.createdAt,'dd/MM/yyyy HH:mm')}"></td><td><b th:text="${item.title}"></b><p class="muted" th:text="${item.message}"></p></td><td><form th:if="${item.readAt==null}" method="post" th:action="@{/notifications/{id}/read(id=${item.id})}"><button type="submit" class="btn btn-small">Đánh dấu đã đọc</button></form><span th:if="${item.readAt!=null}" class="status">Đã đọc</span></td></tr><tr th:if="${#lists.isEmpty(items)}"><td colspan="3">Không có thông báo phù hợp.</td></tr></tbody></table></div><nav class="actions" aria-label="Phân trang thông báo"><a class="btn btn-outline btn-small" th:if="${records.hasPrevious()}" th:href="@{/notifications(page=${records.number - 1},unreadOnly=${unreadOnly})}">Trang trước</a><span class="muted" th:text="|Trang ${records.number + 1} / ${records.totalPages == 0 ? 1 : records.totalPages}|"></span><a class="btn btn-outline btn-small" th:if="${records.hasNext()}" th:href="@{/notifications(page=${records.number + 1},unreadOnly=${unreadOnly})}">Trang sau</a></nav></main></body></html>
