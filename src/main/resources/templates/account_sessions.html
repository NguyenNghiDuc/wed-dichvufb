<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng xuất thiết bị · GrowLab</title><link rel="stylesheet" th:href="@{/style.css}"></head>
<body><header class="topbar"><nav class="nav container"><a class="brand" th:href="@{/}"><span class="brand-icon">↗</span>Grow<strong>Lab</strong></a></nav></header>
<main class="page container"><a class="table-link" th:href="@{/account/password}">← Cài đặt bảo mật</a>
<section class="form-panel narrow">
<div class="eyebrow">Bảo vệ tài khoản</div><h1>Đăng xuất tất cả thiết bị</h1>
<p class="muted">Giữ nguyên mật khẩu hiện tại nhưng buộc các phiên đăng nhập cũ xác thực lại khi truy cập trang riêng tiếp theo.</p>
<p class="error" th:if="${error}" th:text="${error}"></p>
<form method="post" th:action="@{/account/sessions/revoke}">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<div class="field"><label for="currentPassword">Xác nhận mật khẩu hiện tại</label>
<input id="currentPassword" type="password" name="currentPassword" autocomplete="current-password" required></div>
<button class="btn full" type="submit">Đăng xuất các thiết bị</button>
</form><p class="footnote">Đây không phải thao tác xóa tài khoản hoặc đổi mật khẩu.</p>
</section></main></body></html>
