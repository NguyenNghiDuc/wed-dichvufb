<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mã giảm giá · GrowLab</title><link rel="stylesheet" th:href="@{/style.css}"><script defer th:src="@{/site.js}"></script></head><body class="account-page"><header th:replace="~{fragments/site_layout :: header}"></header><main class="page container" id="page-content" tabindex="-1"><div class="page-header"><div><div class="eyebrow">KHUYẾN MÃI</div><h1>Mã giảm giá tư vấn</h1><p class="muted">Giới hạn lượt dùng và điều kiện tính tại server. Thời gian theo UTC.</p></div><a class="btn" th:href="@{/admin/coupons/new}">+ Tạo mã</a></div><form class="actions campaign-filters search-filters" method="get" th:action="@{/admin/coupons}"><div class="search-field"><label for="coupon-enabled">Trạng thái</label><select id="coupon-enabled" name="enabled"><option value="">Tất cả</option><option value="true" th:selected="${enabled == true}">Đang bật</option><option value="false" th:selected="${enabled == false}">Đã tắt</option></select></div><button class="btn" type="submit">Lọc</button><a class="btn btn-outline" th:href="@{/admin/coupons}">Xóa lọc</a></form><p class="muted" th:text="|${records.totalElements} mã giảm giá|"></p><div class="table-panel" tabindex="0" role="region" aria-label="Bảng mã giảm giá cuộn ngang"><table class="data-table"><thead><tr><th>Mã</th><th>Kiểu / giá trị</th><th>Đã dùng</th><th>Kết thúc UTC</th><th>Trạng thái</th></tr></thead><tbody><tr th:each="c : ${records.content}"><td><a class="table-link" th:href="@{/admin/coupons/{id}(id=${c.id})}" th:text="${c.code}"></a></td><td th:text="|${c.type.title}: ${#numbers.formatInteger(c.amount,0,'POINT')}|"></td><td th:text="|${c.usedCount}/${c.maximumUses}|"></td><td th:text="${#temporals.format(c.endsAt,'dd/MM/yyyy HH:mm')}"></td><td th:text="${c.enabled ? 'Đang bật' : 'Đã tắt'}"></td></tr><tr th:if="${records.isEmpty()}"><td colspan="5">Không có mã phù hợp.</td></tr></tbody></table></div><nav class="actions" aria-label="Phân trang mã giảm giá"><a class="btn btn-outline" th:if="${records.hasPrevious()}" th:href="@{/admin/coupons(page=${records.number - 1},enabled=${enabled})}">← Trước</a><span th:text="|Trang ${records.number + 1} / ${records.totalPages == 0 ? 1 : records.totalPages}|"></span><a class="btn btn-outline" th:if="${records.hasNext()}" th:href="@{/admin/coupons(page=${records.number + 1},enabled=${enabled})}">Sau →</a></nav></main></body></html>
