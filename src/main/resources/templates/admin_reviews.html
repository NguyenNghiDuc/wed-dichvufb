<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý đánh giá · GrowLab</title><link rel="stylesheet" th:href="@{/style.css}"><script defer th:src="@{/site.js}"></script></head><body class="account-page"><header th:replace="~{fragments/site_layout :: header}"></header><main class="page container" id="page-content" tabindex="-1"><div class="page-header"><div><div class="eyebrow">PHẢN HỒI DỊCH VỤ</div><h1>Đánh giá từ đơn hoàn thành</h1><p class="muted">Nhận xét riêng của khách hàng, không công bố lên trang bán dịch vụ.</p></div></div><form class="actions campaign-filters search-filters" method="get" th:action="@{/admin/reviews}"><div class="search-field"><label for="rating">Số sao</label><select id="rating" name="rating"><option value="">Tất cả</option><option th:each="n : ${#numbers.sequence(1,5)}" th:value="${n}" th:selected="${rating == n}" th:text="|${n}/5 sao|"></option></select></div><div class="search-field"><label for="kind">Loại đơn</label><select id="kind" name="kind"><option value="">Tất cả</option><option value="CAMPAIGN" th:selected="${kind != null and kind.name() == 'CAMPAIGN'}">Chiến dịch tư vấn</option><option value="TIKTOK" th:selected="${kind != null and kind.name() == 'TIKTOK'}">TikTok</option></select></div><button class="btn" type="submit">Lọc đánh giá</button><a class="btn btn-outline" th:href="@{/admin/reviews}">Xóa lọc</a></form><p class="muted" th:text="|${records.totalElements} đánh giá|"></p><div class="table-panel" tabindex="0" role="region" aria-label="Bảng đánh giá có thể cuộn ngang"><table class="data-table"><thead><tr><th>Đơn</th><th>Khách hàng</th><th>Số sao</th><th>Nhận xét</th><th>Thời gian UTC</th></tr></thead><tbody><tr th:each="r : ${records.content}"><td><a class="table-link" th:href="${r.kind.name() == 'CAMPAIGN'} ? @{/admin/campaign-orders(orderId=${r.orderId})} : @{/admin/tiktok/orders/{id}(id=${r.orderId})}" th:text="|${r.kind} #${r.orderId}|"></a></td><td th:text="${r.ownerUsername}"></td><td class="review-stars" th:text="|${r.rating}/5 ★|"></td><td class="review-comment" th:text="${r.comment}"></td><td th:text="${#temporals.format(r.createdAt,'dd/MM/yyyy HH:mm')}"></td></tr><tr th:if="${records.isEmpty()}"><td colspan="5">Không có đánh giá phù hợp.</td></tr></tbody></table></div><nav class="actions" aria-label="Phân trang đánh giá"><a class="btn btn-outline" th:if="${records.hasPrevious()}" th:href="@{/admin/reviews(page=${records.number - 1},rating=${rating},kind=${kind})}">← Trước</a><span th:text="|Trang ${records.number + 1} / ${records.totalPages == 0 ? 1 : records.totalPages}|"></span><a class="btn btn-outline" th:if="${records.hasNext()}" th:href="@{/admin/reviews(page=${records.number + 1},rating=${rating},kind=${kind})}">Sau →</a></nav></main></body></html>
