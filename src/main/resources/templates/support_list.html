<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yêu cầu hỗ trợ · GrowLab</title><link rel="stylesheet" th:href="@{/style.css}"><script defer th:src="@{/site.js}"></script></head>
<body class="account-page"><header th:replace="~{fragments/site_layout :: header}"></header><main class="page container" id="page-content" tabindex="-1"><a th:href="@{/campaigns}" class="table-link">← Dashboard</a><div class="page-header"><div><div class="eyebrow">Trung tâm hỗ trợ</div><h1>Yêu cầu hỗ trợ của tôi</h1></div><a class="btn" th:href="@{/support/new}">+ Tạo yêu cầu</a></div>
<section th:replace="~{fragments/support_filters :: filters(false)}"></section><div class="table-panel"><table class="data-table"><thead><tr><th>Mã</th><th>Tiêu đề</th><th>Trạng thái</th><th>Ngày cập nhật</th></tr></thead>
<tbody><tr th:each="t : ${tickets}"><td th:text="${t.id}"></td><td><a th:href="@{/support/{id}(id=${t.id})}" class="table-link" th:text="${t.subject}"></a></td><td><span class="status" th:text="${t.status.title}"></span></td><td th:text="${#temporals.format(t.updatedAt,'dd/MM/yyyy HH:mm')}"></td></tr><tr th:if="${#lists.isEmpty(tickets)}"><td colspan="4">Không có yêu cầu phù hợp với bộ lọc.</td></tr></tbody></table></div>
<nav class="actions" aria-label="Phân trang"><a th:if="${hasPrevious}" class="btn btn-outline btn-small" th:href="@{/support(page=${pageNumber - 1},q=${filterQuery},ticketId=${ticketId},status=${selectedStatus})}">← Trước</a><span class="muted" th:text="|Trang ${pageNumber + 1} / ${totalPages == 0 ? 1 : totalPages}|"></span><a th:if="${hasNext}" class="btn btn-outline btn-small" th:href="@{/support(page=${pageNumber + 1},q=${filterQuery},ticketId=${ticketId},status=${selectedStatus})}">Sau →</a></nav></main></body></html>
