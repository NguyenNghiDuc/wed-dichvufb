<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chi tiết chiến dịch · GrowLab</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><main class="page container"><a class="table-link" th:href="@{/campaigns}">← Các chiến dịch</a><div class="page-header"><div><div class="eyebrow">Chi tiết chiến dịch</div><h1 th:text="|Chiến dịch #${order.id}|"></h1><p class="muted" th:text="${order.brief}"></p><span class="status" th:text="${order.status.displayName}"></span></div></div><h2>Lịch sử xử lý</h2><div class="table-panel"><table class="data-table"><thead><tr><th>Thời gian</th><th>Trạng thái</th><th>Ghi chú</th></tr></thead><tbody><tr th:each="e : ${events}"><td th:text="${#temporals.format(e.createdAt,'dd/MM/yyyy HH:mm')}"></td><td th:text="${e.newStatus.displayName}"></td><td th:text="${e.description}"></td></tr></tbody></table></div></main></body></html>
