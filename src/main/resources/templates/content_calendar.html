<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lịch nội dung · GrowLab</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><main class="page container"><a th:href="@{/campaigns}" class="table-link">← Chiến dịch</a><div class="page-header"><div><div class="eyebrow">Lịch nội dung</div><h1>Lên lịch bài viết</h1><p class="muted">Lưu bản nháp và lịch dự kiến. Hệ thống chưa tự động đăng lên mạng xã hội.</p></div></div><div class="form-panel"><h2>Tạo nội dung mới</h2><p class="error" th:if="${error}" th:text="${error}"></p><form method="post" th:action="@{/content-calendar}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="field"><label>Nền tảng</label><select name="platform" required><option th:each="p : ${platforms}" th:value="${p.name()}" th:text="${p.displayName}"></option></select></div><div class="field"><label>Tiêu đề</label><input name="title" maxlength="120" required></div><div class="field"><label>Nội dung</label><textarea name="body" maxlength="3000" required></textarea></div><div class="field"><label>Giờ dự kiến (UTC, không bắt buộc)</label><input type="datetime-local" name="scheduledAtUtc"><small>Để trống để chỉ lưu bản nháp. Đây không phải lịch tự đăng bài.</small></div><button class="btn" type="submit">Lưu nội dung</button></form></div><section class="section"><h2>Danh sách nội dung</h2><div class="table-panel"><table class="data-table"><thead><tr><th>Nền tảng</th><th>Tiêu đề</th><th>Trạng thái</th><th>Lịch UTC</th></tr></thead><tbody><tr th:each="d : ${drafts}"><td th:text="${d.platform.displayName}"></td><td th:text="${d.title}"></td><td><span class="status" th:text="${d.status}"></span></td><td th:text="${d.scheduledAtUtc != null ? #temporals.format(d.scheduledAtUtc,'dd/MM/yyyy HH:mm') : 'Chưa đặt'}"></td></tr><tr th:if="${#lists.isEmpty(drafts)}"><td colspan="4">Chưa có nội dung.</td></tr></tbody></table></div></section></main></body></html>
