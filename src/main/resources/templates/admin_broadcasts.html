<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thông báo hệ thống · GrowLab</title><link rel="stylesheet" th:href="@{/style.css}"><script defer th:src="@{/site.js}"></script></head><body class="account-page"><header th:replace="~{fragments/site_layout :: header}"></header><main class="page container" id="page-content" tabindex="-1"><div class="page-header"><div><div class="eyebrow">QUẢN TRỊ THÔNG BÁO</div><h1>Thông báo hệ thống</h1><p class="muted">Soạn, xem trước và gửi thông báo trên website. Không gửi email.</p></div><a class="btn" th:href="@{/admin/broadcasts/new}">+ Soạn thông báo</a></div><form class="actions campaign-filters search-filters" method="get" th:action="@{/admin/broadcasts}"><div class="search-field"><label for="broadcast-status">Trạng thái</label><select id="broadcast-status" name="status"><option value="">Tất cả</option><option th:each="s : ${statuses}" th:value="${s}" th:text="${s.title}" th:selected="${s == selectedStatus}"></option></select></div><button class="btn" type="submit">Lọc</button><a class="btn btn-outline" th:href="@{/admin/broadcasts}">Xóa lọc</a></form><p class="muted" th:text="|${records.totalElements} thông báo|"></p><div class="table-panel" tabindex="0" role="region" aria-label="Bảng thông báo có thể cuộn ngang"><table class="data-table"><thead><tr><th>Mã / tiêu đề</th><th>Nhóm nhận</th><th>Trạng thái</th><th>Đã gửi đến</th><th>Người tạo</th></tr></thead><tbody><tr th:each="b : ${records.content}"><td><a class="table-link" th:href="@{/admin/broadcasts/{id}(id=${b.id})}" th:text="|#${b.id} · ${b.title}|"></a></td><td th:text="${b.audience.title}"></td><td><span class="status" th:text="${b.status.title}"></span></td><td th:text="${b.recipientCount}"></td><td th:text="${b.createdBy}"></td></tr><tr th:if="${records.isEmpty()}"><td colspan="5">Không có thông báo phù hợp.</td></tr></tbody></table></div><nav class="actions" aria-label="Phân trang thông báo hệ thống"><a class="btn btn-outline" th:if="${records.hasPrevious()}" th:href="@{/admin/broadcasts(page=${records.number - 1},status=${selectedStatus})}">← Trước</a><span th:text="|Trang ${records.number + 1} / ${records.totalPages == 0 ? 1 : records.totalPages}|"></span><a class="btn btn-outline" th:if="${records.hasNext()}" th:href="@{/admin/broadcasts(page=${records.number + 1},status=${selectedStatus})}">Sau →</a></nav></main></body></html>
