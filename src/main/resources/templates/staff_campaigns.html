<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Công việc của tôi · GrowLab</title><link rel="stylesheet" th:href="@{/style.css}"><script defer th:src="@{/site.js}"></script></head><body class="account-page"><header th:replace="~{fragments/site_layout :: header}"></header>
<main class="page container" id="page-content" tabindex="-1"><a class="table-link" th:href="@{/campaigns}">← Trang chủ tài khoản</a>
<div class="page-header"><div><div class="eyebrow">Nhân viên</div><h1>Chiến dịch được phân công</h1>
<p class="muted">Chỉ nhìn thấy các đơn do Admin giao cho tài khoản của bạn.</p></div><a class="btn btn-outline" th:href="@{/admin/support}">Hỗ trợ khách hàng</a></div>
<p class="notice" th:if="${notice}" th:text="${notice}"></p>
<p class="error" role="alert" th:if="${error}" th:text="${error}"></p>
<div class="table-panel"><table class="data-table"><thead><tr><th>Mã</th><th>Nền tảng</th><th>Dịch vụ</th><th>Khách hàng</th><th>Trạng thái</th><th>Xử lý</th></tr></thead>
<tbody><tr th:each="o : ${orders}"><td th:text="${o.id}"></td><td th:text="${o.platform.displayName}"></td><td th:text="${o.serviceType.displayName}"></td>
<td th:text="${o.ownerUsername}"></td><td><span class="status" th:text="${o.status.displayName}"></span></td>
<td><form th:if="${o.status.name() == 'APPROVED' or o.status.name() == 'IN_PROGRESS'}"
 method="post" th:action="@{/staff/campaign-orders/{id}/progress(id=${o.id})}">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<input type="hidden" name="status" th:value="${o.status.name() == 'APPROVED' ? 'IN_PROGRESS' : 'COMPLETED'}">
<button class="btn btn-small" th:text="${o.status.name() == 'APPROVED' ? 'Bắt đầu' : 'Hoàn thành'}"></button></form>
<span th:if="${o.status.name() == 'PENDING_REVIEW'}" class="muted">Chờ Admin duyệt</span></td></tr>
<tr th:if="${#lists.isEmpty(orders)}"><td colspan="6">Chưa có chiến dịch được giao.</td></tr></tbody></table></div>
<nav class="actions"><a th:if="${hasPrevious}" th:href="@{/staff/campaign-orders(page=${page - 1})}" class="btn btn-outline btn-small">← Trước</a>
<a th:if="${hasNext}" th:href="@{/staff/campaign-orders(page=${page + 1})}" class="btn btn-outline btn-small">Sau →</a></nav>
</main></body></html>
