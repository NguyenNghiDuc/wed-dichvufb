<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trợ giúp · GrowLab</title><link rel="stylesheet" th:href="@{/style.css}"><script defer th:src="@{/site.js}"></script></head><body class="account-page"><header th:replace="~{fragments/site_layout :: header}"></header><main class="page container" id="page-content" tabindex="-1"><div class="page-header"><div><div class="eyebrow">Trung tâm trợ giúp</div><h1>Câu hỏi thường gặp</h1><p class="muted">Tìm nhanh hướng dẫn về tài khoản, đơn hàng và hỗ trợ. Có thể tìm bằng tiếng Việt không dấu.</p></div></div><form class="actions campaign-filters search-filters" method="get" th:action="@{/help}" role="search" aria-label="Tìm câu hỏi thường gặp"><div class="search-field"><label for="help-query">Bạn cần trợ giúp gì?</label><input id="help-query" name="q" maxlength="120" th:value="${filterQuery}" placeholder="Ví dụ: mat khau, huy don..."></div><div class="search-field"><label for="help-category">Chủ đề</label><select id="help-category" name="category"><option value="">Tất cả</option><option value="account" th:selected="${category == 'account'}">Tài khoản và bảo mật</option><option value="orders" th:selected="${category == 'orders'}">Dịch vụ và đơn hàng</option><option value="payments" th:selected="${category == 'payments'}">Thanh toán</option><option value="support" th:selected="${category == 'support'}">Hỗ trợ</option></select></div><button class="btn" type="submit">Tìm kiếm</button><a class="btn btn-outline" th:href="@{/help}">Xóa lọc</a></form><p class="muted" role="status" th:text="|Tìm thấy ${#lists.size(questions)} câu hỏi.|"></p><div class="faq-list"><details class="card faq-item" th:each="f : ${questions}" th:id="${f.id}"><summary th:text="${f.title}"></summary><p th:text="${f.answer}"></p></details></div><article class="card" th:if="${#lists.isEmpty(questions)}"><h2>Chưa tìm thấy hướng dẫn phù hợp</h2><p class="muted">Thử từ khóa ngắn hơn, đổi chủ đề hoặc gửi yêu cầu để nhân viên hỗ trợ.</p></article><div class="actions"><a class="btn" th:unless="${navSignedIn}" th:href="@{/login}">Đăng nhập</a><a class="btn btn-outline" th:href="@{/support/new}">Tạo yêu cầu hỗ trợ</a></div></main></body></html>
