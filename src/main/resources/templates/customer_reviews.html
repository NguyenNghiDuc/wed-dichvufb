<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đánh giá của tôi · GrowLab</title>
<link rel="stylesheet" th:href="@{/style.css}">
<link rel="stylesheet" th:href="@{/customer.css}">
</head>
<body><main class="page container">
<a class="table-link" th:href="@{/campaigns}">← Dashboard khách hàng</a>
<div class="page-header"><div><div class="eyebrow">Phản hồi đã gửi</div>
<h1>Đánh giá dịch vụ của tôi</h1>
<p class="muted">Chỉ những đánh giá của tài khoản này; không hiển thị công khai.</p></div></div>
<div class="table-panel"><table class="data-table">
<thead><tr><th>Chiến dịch</th><th>Đánh giá</th><th>Phản hồi</th><th>Ngày gửi</th></tr></thead>
<tbody>
<tr th:each="r : ${reviews}">
<td><a class="table-link" th:href="@{/campaigns/{id}(id=${r.campaignId()})}" th:text="|#${r.campaignId()}|">#1</a></td>
<td th:text="|${r.rating()}/5 sao|">5/5 sao</td>
<td th:text="${r.feedback()}">Phản hồi</td>
<td th:text="${#temporals.format(r.createdAt(), 'dd/MM/yyyy HH:mm')}">Thời gian</td>
</tr>
<tr th:if="${#lists.isEmpty(reviews)}"><td colspan="4" class="muted">Bạn chưa gửi đánh giá dịch vụ nào.</td></tr>
</tbody></table></div>
<nav class="actions" aria-label="Phân trang đánh giá">
<a th:if="${hasPrevious}" class="btn btn-outline btn-small"
   th:href="@{/campaigns/reviews(page=${pageNumber - 1})}">← Trang trước</a>
<span class="muted" th:text="|Trang ${pageNumber+1} / ${totalPages == 0 ? 1 : totalPages}|">Trang 1</span>
<a th:if="${hasNext}" class="btn btn-outline btn-small"
   th:href="@{/campaigns/reviews(page=${pageNumber + 1})}">Trang sau →</a>
</nav>
</main></body></html>
