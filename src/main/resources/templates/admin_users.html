<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Tài khoản</title><link rel="stylesheet" th:href="@{/style.css}"><script defer th:src="@{/site.js}"></script></head><body class="account-page"><header th:replace="~{fragments/site_layout :: header}"></header>
<main class="page container" id="page-content" tabindex="-1"><a class="table-link" th:href="@{/admin/campaign-orders}">← Admin dashboard</a>
<div class="page-header"><div><div class="eyebrow">Quản trị người dùng</div><h1>Tài khoản khách hàng</h1><p class="muted">Phân quyền và khóa tài khoản có ghi nhật ký.</p></div><a class="btn btn-outline" th:href="@{/admin/users/audit}">Nhật ký thay đổi</a></div>
<form class="actions campaign-filters search-filters" method="get" th:action="@{/admin/users}" role="search" aria-label="Tìm tài khoản"><div class="search-field"><label for="user-query">Tìm tài khoản</label><input id="user-query" name="q" maxlength="120" th:value="${filterQuery}" placeholder="Tên, email hoặc tên hiển thị"></div><div class="search-field"><label for="user-role">Quyền</label><select id="user-role" name="role"><option value="">Tất cả</option><option th:each="r : ${ {'USER','STAFF','ADMIN'} }" th:value="${r}" th:text="${r}" th:selected="${r == filterRole}"></option></select></div><div class="search-field"><label for="user-enabled">Trạng thái</label><select id="user-enabled" name="enabled"><option value="">Tất cả</option><option value="true" th:selected="${filterEnabled == true}">Hoạt động</option><option value="false" th:selected="${filterEnabled == false}">Đã khóa</option></select></div><button class="btn btn-small" type="submit">Tìm kiếm</button><a class="btn btn-outline btn-small" th:href="@{/admin/users}">Xóa lọc</a></form><p class="footnote" role="status" th:text="|Tìm thấy ${totalElements} tài khoản.|"></p><p class="success-message" role="status" th:if="${success}" th:text="${success}"></p><p class="error" role="alert" th:if="${error}" th:text="${error}"></p><div class="table-panel" tabindex="0" role="region" aria-label="Danh sách tài khoản, cuộn ngang để xem đầy đủ"><table class="data-table account-users-table"><thead><tr><th>ID</th><th>Tài khoản</th><th>Email</th><th>Quyền</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>
<tr th:each="u : ${users}"><td th:text="${u.id}"></td><td th:text="${u.username}"></td><td th:text="${u.email != null ? u.email : '—'}"></td><td th:text="${u.role}"></td><td><span class="status" th:text="${u.enabled ? 'Hoạt động' : 'Đã khóa'}"></span><p class="footnote" th:if="${u.loginLockedUntil != null and u.loginLockedUntil.isAfter(securityNow)}" th:text="|Tạm khóa đăng nhập đến ${#temporals.format(u.loginLockedUntil,'dd/MM HH:mm')} UTC|"></p></td><td>
<a class="table-link" th:href="@{/admin/users/{id}/security(id=${u.id})}">Phiên và lịch sử</a><div th:if="${u.username != ownUsername}">
<form class="inline-form" method="post" th:action="@{/admin/users/{id}/enabled(id=${u.id})}" data-confirm="Thay đổi trạng thái đăng nhập của tài khoản này?"><div th:replace="~{fragments/admin_user_filters :: retained}"></div><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="enabled" th:value="${!u.enabled}"><button class="btn btn-outline btn-small" type="submit" th:text="${u.enabled ? 'Khóa' : 'Mở khóa'}"></button></form>
<form class="inline-form" method="post" th:action="@{/admin/users/{id}/role(id=${u.id})}" data-confirm="Thay đổi quyền tài khoản này? Các phiên cũ sẽ bị thu hồi ở lần truy cập tiếp theo."><div th:replace="~{fragments/admin_user_filters :: retained}"></div><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><select name="role"><option value="USER" th:selected="${u.role == 'USER'}">USER</option><option value="STAFF" th:selected="${u.role == 'STAFF'}">STAFF</option><option value="ADMIN" th:selected="${u.role == 'ADMIN'}">ADMIN</option></select><button class="btn btn-small" type="submit">Lưu quyền</button></form></div>
<span th:if="${u.username == ownUsername}" class="muted">Tài khoản hiện tại</span>
</td></tr><tr th:if="${#lists.isEmpty(users)}"><td colspan="6">Không có tài khoản phù hợp.</td></tr></tbody></table></div>
<nav class="actions"><a th:if="${hasPrevious}" class="btn btn-outline btn-small" th:href="@{/admin/users(page=${page - 1},q=${filterQuery},role=${filterRole},enabled=${filterEnabled})}">← Trang trước</a><span th:text="|Trang ${page + 1} / ${totalPages == 0 ? 1 : totalPages}|"></span><a th:if="${hasNext}" class="btn btn-outline btn-small" th:href="@{/admin/users(page=${page + 1},q=${filterQuery},role=${filterRole},enabled=${filterEnabled})}">Trang sau →</a></nav></main></body></html>
