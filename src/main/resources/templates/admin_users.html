<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Tài khoản</title><link rel="stylesheet" th:href="@{/style.css}"></head><body>
<main class="page container"><a class="table-link" th:href="@{/admin/campaign-orders}">← Admin dashboard</a>
<div class="page-header"><div><div class="eyebrow">Quản trị người dùng</div><h1>Tài khoản khách hàng</h1><p class="muted">Phân quyền và khóa tài khoản có ghi nhật ký.</p></div><a class="btn btn-outline" th:href="@{/admin/users/audit}">Nhật ký thay đổi</a></div>
<p class="error" th:if="${error}" th:text="${error}"></p><div class="table-panel"><table class="data-table"><thead><tr><th>ID</th><th>Tài khoản</th><th>Email</th><th>Quyền</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>
<tr th:each="u : ${users}"><td th:text="${u.id}"></td><td th:text="${u.username}"></td><td th:text="${u.email != null ? u.email : '—'}"></td><td th:text="${u.role}"></td><td><span class="status" th:text="${u.enabled ? 'Hoạt động' : 'Đã khóa'}"></span></td><td>
<div th:if="${u.username != ownUsername}">
<form class="inline-form" method="post" th:action="@{/admin/users/{id}/enabled(id=${u.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="enabled" th:value="${!u.enabled}"><button class="btn btn-outline btn-small" type="submit" th:text="${u.enabled ? 'Khóa' : 'Mở khóa'}"></button></form>
<form class="inline-form" method="post" th:action="@{/admin/users/{id}/role(id=${u.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><select name="role"><option value="USER" th:selected="${u.role == 'USER'}">USER</option><option value="STAFF" th:selected="${u.role == 'STAFF'}">STAFF</option><option value="ADMIN" th:selected="${u.role == 'ADMIN'}">ADMIN</option></select><button class="btn btn-small" type="submit">Lưu quyền</button></form></div>
<span th:if="${u.username == ownUsername}" class="muted">Tài khoản hiện tại</span>
</td></tr><tr th:if="${#lists.isEmpty(users)}"><td colspan="6">Chưa có người dùng.</td></tr></tbody></table></div>
<nav class="actions"><a th:if="${hasPrevious}" class="btn btn-outline btn-small" th:href="@{/admin/users(page=${page - 1})}">← Trang trước</a><span th:text="|Trang ${page + 1}|"></span><a th:if="${hasNext}" class="btn btn-outline btn-small" th:href="@{/admin/users(page=${page + 1})}">Trang sau →</a></nav></main></body></html>
