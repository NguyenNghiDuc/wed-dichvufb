<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sửa bản nháp · GrowLab</title><link rel="stylesheet" th:href="@{/style.css}"></head>
<body><main class="page container">
<a th:href="@{/content-calendar}" class="table-link">← Lịch nội dung</a>
<div class="page-header"><div><div class="eyebrow">Lịch nội dung</div><h1>Chỉnh sửa bài viết</h1><p class="muted">Thay đổi nội dung hoặc xóa lịch dự kiến; không tự động đăng bài.</p></div></div>
<div class="form-panel">
<p class="error" th:if="${error}" th:text="${error}"></p>
<form method="post" th:action="@{/content-calendar/{id}/edit(id=${draft.id})}">
<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
<div class="field"><label for="platform">Nền tảng</label><select id="platform" name="platform" required>
<option th:each="p : ${platforms}" th:value="${p.name()}" th:text="${p.displayName}" th:selected="${p == draft.platform}"></option>
</select></div>
<div class="field"><label for="title">Tiêu đề</label><input id="title" name="title" maxlength="120" required aria-describedby="title-count" th:value="${draft.title}"><small id="title-count" aria-live="polite"></small></div>
<div class="field"><label for="body">Nội dung</label><textarea id="body" name="body" maxlength="3000" required aria-describedby="body-count" th:text="${draft.body}"></textarea><small id="body-count" aria-live="polite"></small></div>
<div class="field"><label for="schedule">Giờ dự kiến (UTC)</label><input id="schedule" type="datetime-local" name="scheduledAtUtc" th:value="${scheduleValue}">
<small>Để trống để chuyển về bản nháp. Chỉ cho phép thời gian 1 phút–1 năm trong tương lai.</small></div>
<div class="actions"><button class="btn" type="submit">Lưu thay đổi</button><a class="btn btn-outline" th:href="@{/content-calendar}">Quay lại</a></div>
</form>
</div></main>
<script>
  for (const item of [{fieldId:'title', countId:'title-count', limit:120}, {fieldId:'body', countId:'body-count', limit:3000}]) {
    const {fieldId, countId, limit} = item;
    const field = document.getElementById(fieldId);
    const count = document.getElementById(countId);
    if (field && count) {
      const update = () => { count.textContent = field.value.length + ' / ' + limit + ' ký tự'; };
      field.addEventListener('input', update);
      update();
    }
  }
</script>
</body></html>
