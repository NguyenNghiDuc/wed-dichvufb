<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Yêu cầu nạp tiền · GrowLab</title><link rel="stylesheet" th:href="@{/style.css}"><script defer th:src="@{/site.js}"></script></head><body class="account-page"><header th:replace="~{fragments/site_layout :: header}"></header><main class="page container" id="page-content" tabindex="-1"><div class="page-header"><h1>Lịch sử yêu cầu nạp tiền</h1><a class="btn" th:href="@{/deposit/new}">+ Tạo yêu cầu</a></div><p class="success-message" role="status" th:if="${success}" th:text="${success}"></p><div class="table-panel"><table class="data-table"><thead><tr><th>Mã</th><th>Ngày tạo</th><th>Số tiền</th><th>Trạng thái</th></tr></thead><tbody><tr th:each="d : ${deposits}"><td th:text="${d.id}"></td><td th:text="${#temporals.format(d.createdAt, 'dd/MM/yyyy HH:mm')}"></td><td th:text="|${#numbers.formatInteger(d.amount,0,'POINT')} đ|"></td><td><span class="status" th:text="${d.status == 'PENDING' ? 'Chờ xử lý' : d.status}"></span></td></tr><tr th:if="${#lists.isEmpty(deposits)}"><td colspan="4">Bạn chưa có yêu cầu nạp tiền. Chọn “Tạo yêu cầu” để bắt đầu.</td></tr></tbody></table></div><p class="footnote"><a class="table-link" th:href="@{/}">← Về trang chủ</a></p></main></body></html>
