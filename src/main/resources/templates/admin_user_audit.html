<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · Nhật ký tài khoản</title><link rel="stylesheet" th:href="@{/style.css}">
<link rel="stylesheet" th:href="@{/admin.css}"></head><body class="admin-body">
<main class="page container admin-page">
<nav class="admin-breadcrumb" aria-label="Điều hướng"><a th:href="@{/admin/users}">← Quản lý tài khoản</a><span>/</span><strong>Nhật ký</strong></nav>
<div class="page-header admin-page-header"><div><div class="eyebrow">Kiểm soát thay đổi</div>
<h1>Nhật ký quản trị tài khoản</h1><p class="muted">Lịch sử khóa và cấp quyền, 20 sự kiện mỗi trang. Không thể sửa/xóa từ giao diện.</p></div></div>
<div class="table-panel admin-table-scroll"><table class="data-table admin-table">
<thead><tr><th>Thời gian</th><th>Admin</th><th>ID tài khoản</th><th>Hành động</th><th>Trước</th><th>Sau</th></tr></thead>
<tbody><tr th:each="e : ${events}"><td th:text="${#temporals.format(e.createdAt,'dd/MM/yyyy HH:mm')}"></td>
<td th:text="${e.actor}"></td><td th:text="${e.targetUserId}"></td>
<td><span class="admin-role" th:text="${e.operation}"></span></td>
<td th:text="${e.beforeValue}"></td><td th:text="${e.afterValue}"></td></tr>
<tr th:if="${#lists.isEmpty(events)}"><td colspan="6" class="admin-empty">Chưa có hành động được ghi nhận.</td></tr></tbody>
</table></div>
<nav class="admin-pager" aria-label="Phân trang audit"><a th:if="${hasPrevious}" th:href="@{/admin/users/audit(page=${auditPage - 1})}" class="btn btn-outline btn-small">← Trước</a>
<span th:text="|Trang ${auditPage + 1} / ${totalAuditPages == 0 ? 1 : totalAuditPages}|"></span>
<a th:if="${hasNext}" th:href="@{/admin/users/audit(page=${auditPage + 1})}" class="btn btn-outline btn-small">Sau →</a></nav>
</main></body></html>
