<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Nhật ký tài khoản</title><link rel="stylesheet" th:href="@{/style.css}"><script defer th:src="@{/site.js}"></script></head><body class="account-page"><header th:replace="~{fragments/site_layout :: header}"></header><main class="page container" id="page-content" tabindex="-1"><a class="table-link" th:href="@{/admin/users}">← Tài khoản</a><h1>Nhật ký quản trị tài khoản</h1>
<div class="table-panel"><table class="data-table"><thead><tr><th>Thời gian</th><th>Admin</th><th>ID người dùng</th><th>Hành động</th><th>Trước</th><th>Sau</th></tr></thead><tbody>
<tr th:each="e : ${events}"><td th:text="${#temporals.format(e.createdAt,'dd/MM/yyyy HH:mm')}"></td><td th:text="${e.actor}"></td><td th:text="${e.targetUserId}"></td><td th:text="${e.operation}"></td><td th:text="${e.beforeValue}"></td><td th:text="${e.afterValue}"></td></tr>
<tr th:if="${#lists.isEmpty(events)}"><td colspan="6">Chưa có hành động được ghi nhận.</td></tr></tbody></table></div></main></body></html>
