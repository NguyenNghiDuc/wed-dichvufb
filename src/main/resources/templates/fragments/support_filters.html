<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body><section th:fragment="filters(isAdmin)"><form class="actions campaign-filters search-filters" method="get" th:action="${isAdmin} ? @{/admin/support} : @{/support}" role="search" aria-label="Tìm yêu cầu hỗ trợ"><div class="search-field"><label for="support-query">Tiêu đề</label><input id="support-query" name="q" maxlength="120" th:value="${filterQuery}" placeholder="Từ khóa tiêu đề"></div><div class="search-field"><label for="ticketId">Mã yêu cầu</label><input id="ticketId" name="ticketId" type="number" min="1" th:value="${ticketId}"></div><div class="search-field"><label for="ticket-status">Trạng thái</label><select id="ticket-status" name="status"><option value="">Tất cả</option><option th:each="s : ${ticketStatuses}" th:value="${s.name()}" th:text="${s.title}" th:selected="${s == selectedStatus}"></option></select></div><div class="search-field" th:if="${isAdmin}"><label th:if="${isAdmin}" for="support-owner">Khách hàng</label><input th:if="${isAdmin}" id="support-owner" name="owner" maxlength="100" th:value="${ownerFilter}" placeholder="Tên đăng nhập chính xác"></div><button class="btn btn-small" type="submit">Tìm kiếm</button><a class="btn btn-outline btn-small" th:href="${isAdmin} ? @{/admin/support} : @{/support}">Xóa lọc</a></form><p class="footnote" role="status" th:text="|Tìm thấy ${totalElements} yêu cầu hỗ trợ.|"></p></section></body></html>
