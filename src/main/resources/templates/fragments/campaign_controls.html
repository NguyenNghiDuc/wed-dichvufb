<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body>
<dialog th:fragment="cancelDialog" class="confirm-dialog" id="cancel-confirm" aria-labelledby="cancel-title"><h2 id="cancel-title">Hủy yêu cầu <span id="cancel-order-label"></span>?</h2><p class="muted">Yêu cầu đã hủy không thể khôi phục. Bạn có thể tạo chiến dịch mới khi cần.</p><p class="notice">Chỉ đơn đang chờ duyệt mới có thể hủy. Không phát sinh thanh toán khi hủy.</p><div class="actions"><button class="btn btn-outline" type="button" data-close-dialog>Giữ yêu cầu</button><button class="btn" type="button" id="confirm-cancel">Xác nhận hủy</button></div></dialog>
</body></html>
