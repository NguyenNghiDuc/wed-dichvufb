<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý yêu cầu nạp tiền · GrowLab</title><link rel="stylesheet" th:href="@{/style.css}"><script defer th:src="@{/site.js}"></script></head><body class="account-page"><header th:replace="~{fragments/site_layout :: header}"></header><main class="page container" id="page-content" tabindex="-1"><div class="page-header"><div><div class="eyebrow">Quản trị / Nạp tiền</div><h1>Quản lý yêu cầu nạp tiền</h1><p class="muted">Theo dõi yêu cầu theo trạng thái. Chỉ đối soát giao dịch qua nguồn thanh toán tin cậy mới tạo khoản ghi có ví.</p></div></div><p class="success-message" role="status" th:if="${success}" th:text="${success}"></p><form class="actions campaign-filters" method="get" th:action="@{/admin/deposits}"><label for="deposit-status">Trạng thái</label><select id="deposit-status" name="status"><option value="">Tất cả</option><option value="PENDING" th:selected="${selectedStatus == 'PENDING'}">Chờ xử lý</option><option value="APPROVED" th:selected="${selectedStatus == 'APPROVED'}">Đã xác nhận</option><option value="CANCELLED" th:selected="${selectedStatus == 'CANCELLED'}">Đã hủy</option></select><label for="deposit-owner">Tên tài khoản</label><input id="deposit-owner" name="owner" th:value="${owner}" maxlength="100" placeholder="Tên tài khoản chính xác"><button type="submit" class="btn btn-small">Lọc yêu cầu</button><a class="table-link" th:href="@{/admin/deposits}">Xóa lọc</a></form><p class="muted" role="status" th:text="|${records.totalElements} yêu cầu · Trang ${records.number + 1}|"></p><div class="table-panel"><table class="data-table"><thead><tr><th scope="col">Mã</th><th scope="col">Khách hàng</th><th scope="col">Ngày tạo (UTC)</th><th scope="col">Số tiền</th><th scope="col">Trạng thái</th><th scope="col">Ghi chú</th></tr></thead><tbody><tr th:each="d : ${records.content}"><td th:text="|#${d.id}|"></td><td th:text="${d.ownerUsername}"></td><td th:text="${#temporals.format(d.createdAt, 'dd/MM/yyyy HH:mm')}"></td><td th:text="|${#numbers.formatInteger(d.amount,0,'POINT')} đ|"></td><td><span class="status" th:text="${d.status == 'PENDING' ? 'Chờ xử lý' : (d.status == 'CANCELLED' ? 'Đã hủy' : (d.status == 'APPROVED' ? 'Đã xác nhận' : d.status))}"></span></td><td th:text="${d.note}"></td></tr><tr th:if="${records.empty}"><td colspan="6" class="empty-state">Chưa có yêu cầu phù hợp với bộ lọc.</td></tr></tbody></table></div><nav class="actions" aria-label="Phân trang yêu cầu nạp tiền"><a class="btn btn-outline" th:if="${records.hasPrevious()}" th:href="@{/admin/deposits(page=${records.number - 1},status=${selectedStatus},owner=${owner})}">← Trang trước</a><a class="btn btn-outline" th:if="${records.hasNext()}" th:href="@{/admin/deposits(page=${records.number + 1},status=${selectedStatus},owner=${owner})}">Trang sau →</a></nav><p class="footnote"><a class="table-link" th:href="@{/}">← Về trang chủ</a></p></main></body></html>
