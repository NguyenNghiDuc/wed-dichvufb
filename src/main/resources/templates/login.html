<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đăng nhập · GrowLab</title><link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}"><link rel="stylesheet" th:href="@{/style.css}"></head><body>
<header class="topbar"><nav class="nav container"><a class="brand" th:href="@{/}"><span class="brand-icon">↗</span>Grow<strong>Lab</strong></a><div class="nav-links"><a th:href="@{/register}">Tạo tài khoản</a></div></nav></header>
<main class="page container"><section class="form-panel narrow"><div class="eyebrow">Chào mừng trở lại</div><h2>Đăng nhập</h2><p class="muted">Quản lý các chiến dịch mạng xã hội của bạn.</p>
<div th:if="${param.sessionExpired}" class="notice">Phiên đăng nhập cũ đã hết hạn. Vui lòng đăng nhập lại.</div>
<div th:if="${param.error}" class="error">Tài khoản hoặc mật khẩu không chính xác.</div><div th:if="${param.registered}" class="notice">Tạo tài khoản thành công. Hãy đăng nhập.</div><div th:if="${param.logout}" class="notice">Bạn đã đăng xuất.</div>
<form method="post" th:action="@{/login}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="field"><label for="username">Tên tài khoản</label><input id="username" type="text" name="username" autocomplete="username" required></div><div class="field"><label for="password">Mật khẩu</label><input id="password" type="password" name="password" autocomplete="current-password" required></div><button class="btn full" type="submit">Đăng nhập →</button></form><p class="footnote">Chưa có tài khoản? <a class="table-link" th:href="@{/register}">Đăng ký ngay</a></p></section></main></body></html>
