<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>

<title>Hội thoại tạm thời không khả dụng · GrowLab</title>

<body><main class="page container">
<section class="chat-load-error" role="alert" aria-labelledby="chat-load-error-title">

<p>Hệ thống hỗ trợ đang tạm thời không phản hồi. Không cần gửi lại tin nhắn nhiều lần.</p>
<p class="muted">Bạn có thể thử tải lại trang hoặc trở về Trung tâm hỗ trợ.</p>
<div class="actions">
<a class="btn" th:href="@{/chat/ui}" href="/chat/ui">Thử lại</a>
<a class="btn btn-outline" th:href="@{/support}" href="/support">Trung tâm hỗ trợ</a>
</div>
</section></main></body></html>
