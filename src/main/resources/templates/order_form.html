<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đơn hàng cũ · GrowLab</title><link rel="stylesheet" th:href="@{/style.css}"></head><body><main class="page container"><div class="page-header"><h1>Biểu mẫu đơn hàng cũ</h1><a class="btn btn-outline" th:href="@{/campaigns/new}">Dùng chiến dịch mới →</a></div><div class="form-panel"><p class="notice">Đơn hàng cũ chỉ được lưu nội bộ; không có chức năng tự tăng follower hoặc thanh toán.</p><p class="error" th:if="${error}" th:text="${error}"></p><form method="post" th:action="@{/order/save}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="field"><label>Link</label><input name="linkOrder" maxlength="255" required></div><div class="field"><label>Tên dịch vụ</label><input name="serverName" maxlength="255"></div><div class="field"><label>Số lượng</label><input name="quantity" type="number" min="1" max="10000" required></div><div class="field"><label>Ghi chú</label><textarea name="note" maxlength="255"></textarea></div><p class="footnote">Giá đơn vị cố định trên server: 10 VND.</p><button class="btn" type="submit">Lưu đơn</button></form></div></main></body></html>
