<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chi tiết hỗ trợ · GrowLab</title><link rel="stylesheet" th:href="@{/style.css}"><script defer th:src="@{/site.js}"></script></head>
<body class="account-page"><header th:replace="~{fragments/site_layout :: header}"></header><main class="page container" id="page-content" tabindex="-1"><a th:href="@{/support}" class="table-link">← Các yêu cầu</a>
<div class="page-header"><div><div class="eyebrow">Yêu cầu hỗ trợ</div><h1 th:text="${ticket.subject}"></h1><span class="status" th:text="${ticket.status.title}"></span></div></div>
<p class="success-message" th:if="${success}" role="status" th:text="${success}"></p><article class="card"><p th:text="${ticket.description}"></p></article>
<section class="section"><h2>Trao đổi</h2><article class="card" th:each="m : ${messages}"><b th:text="${m.author}"></b><p th:text="${m.body}"></p><p class="footnote" th:text="${#temporals.format(m.createdAt,'dd/MM/yyyy HH:mm')}"></p></article>
<div class="form-panel" th:if="${ticket.status.name() != 'CLOSED'}"><p class="error" role="alert" th:if="${error}" th:text="${error}"></p><form method="post" th:action="@{/support/{id}/reply(id=${ticket.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="field"><label>Trả lời</label><textarea name="message" th:text="${inputMessage}" required minlength="2" maxlength="2000"></textarea></div><button type="submit" class="btn">Gửi phản hồi</button></form></div><form th:if="${ticket.status.name() != 'CLOSED'}" class="mt-3" method="post" th:action="@{/support/{id}/close(id=${ticket.id})}" data-confirm="Đóng yêu cầu hỗ trợ này? Bạn vẫn xem được lịch sử nhưng không thể gửi thêm phản hồi."><button class="btn btn-outline" type="submit">Vấn đề đã được giải quyết — đóng yêu cầu</button></form><p class="notice" th:if="${ticket.status.name() == 'CLOSED'}">Yêu cầu đã đóng. Nếu cần trao đổi thêm, hãy tạo một yêu cầu hỗ trợ mới.</p></section></main></body></html>
