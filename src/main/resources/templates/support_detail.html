<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chi tiết hỗ trợ · GrowLab</title><link rel="stylesheet" th:href="@{/style.css}"></head>
<body><main class="page container"><a th:href="@{/support}" class="table-link">← Các yêu cầu</a>
<div class="page-header"><div><div class="eyebrow">Yêu cầu hỗ trợ</div><h1 th:text="${ticket.subject}"></h1><span class="status" th:text="${ticket.status.title}"></span></div></div>
<article class="card"><p th:text="${ticket.description}"></p></article>
<section class="section"><h2>Trao đổi</h2><article class="card" th:each="m : ${messages}"><b th:text="${m.author}"></b><p th:text="${m.body}"></p><p class="footnote" th:text="${#temporals.format(m.createdAt,'dd/MM/yyyy HH:mm')}"></p></article>
<div class="form-panel" th:if="${ticket.status.name() != 'CLOSED'}"><p class="error" th:if="${error}" th:text="${error}"></p><form method="post" th:action="@{/support/{id}/reply(id=${ticket.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="field"><label>Trả lời</label><textarea name="message" required minlength="2" maxlength="2000"></textarea></div><button type="submit" class="btn">Gửi phản hồi</button></form></div></section></main></body></html>
