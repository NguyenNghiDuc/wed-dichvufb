<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đánh giá dịch vụ · GrowLab</title><link rel="stylesheet" th:href="@{/style.css}"><script defer th:src="@{/site.js}"></script></head><body class="account-page"><header th:replace="~{fragments/site_layout :: header}"></header><main class="page container" id="page-content" tabindex="-1"><a class="table-link" th:href="${kind.name() == 'CAMPAIGN'} ? @{/campaigns/{id}(id=${orderId})} : @{/tiktok/orders/{id}(id=${orderId})}">← Chi tiết đơn hàng</a><div class="page-header"><div><div class="eyebrow">PHẢN HỒI KHÁCH HÀNG</div><h1 th:text="|Đánh giá đơn #${orderId}|"></h1><p class="muted">Mỗi đơn hoàn thành được gửi một đánh giá. Nhận xét chỉ hiển thị với bạn và Admin.</p></div></div><p class="success-message" th:if="${success}" th:text="${success}" role="status"></p><p class="error" th:if="${error}" th:text="${error}" role="alert"></p><article class="form-panel" th:if="${review != null}"><h2>Đã ghi nhận đánh giá</h2><p class="review-stars" th:text="|${review.rating}/5 ★|"></p><p class="review-comment" th:text="${review.comment}"></p><p class="muted" th:text="|Gửi lúc ${#temporals.format(review.createdAt,'dd/MM/yyyy HH:mm')} UTC|"></p></article><form th:if="${review == null}" class="form-panel" method="post" th:action="@{/reviews/{kind}/{id}(kind=${kind},id=${orderId})}"><div class="field"><label for="review-rating">Mức độ hài lòng</label><select id="review-rating" name="rating" required><option value="">Chọn số sao</option><option th:each="n : ${#numbers.sequence(1,5)}" th:value="${n}" th:selected="${inputRating == n}" th:text="|${n}/5 sao|"></option></select></div><div class="field"><label for="review-comment">Nhận xét</label><textarea id="review-comment" name="comment" minlength="10" maxlength="1000" required rows="5" th:text="${inputComment}" placeholder="Điều bạn hài lòng hoặc muốn cải thiện..."></textarea></div><button type="submit" class="btn">Gửi đánh giá</button></form></main></body></html>
