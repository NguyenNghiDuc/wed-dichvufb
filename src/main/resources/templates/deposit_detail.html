<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chi tiết yêu cầu nạp tiền · GrowLab</title><link rel="stylesheet" th:href="@{/style.css}"><script defer th:src="@{/site.js}"></script></head><body class="account-page"><header th:replace="~{fragments/site_layout :: header}"></header><main class="page container" id="page-content" tabindex="-1"><div class="page-header"><div><div class="eyebrow">Yêu cầu nạp tiền</div><h1 th:text="|Yêu cầu #${deposit.id}|"></h1></div><a class="btn btn-outline" th:href="@{/deposit/list}">← Lịch sử yêu cầu</a></div><p class="success-message" role="status" th:if="${success}" th:text="${success}"></p><div class="deposit-layout"><section class="card"><div class="deposit-total"><span>Số tiền yêu cầu</span><strong th:text="|${#numbers.formatInteger(deposit.amount,0,'POINT')} đ|"></strong></div><dl class="deposit-facts"><dt>Trạng thái</dt><dd class="status" th:text="${deposit.status == 'PENDING' ? 'Chờ xử lý' : (deposit.status == 'CANCELLED' ? 'Đã hủy' : (deposit.status == 'APPROVED' ? 'Đã xác nhận' : deposit.status))}"></dd><dt>Ngày tạo (UTC)</dt><dd th:text="${#temporals.format(deposit.createdAt,'dd/MM/yyyy HH:mm')}"></dd><dt>Ghi chú của bạn</dt><dd class="deposit-note-text" th:text="${#strings.isEmpty(deposit.note) ? 'Không có ghi chú.' : deposit.note}"></dd></dl><form th:if="${deposit.status == 'PENDING'}" method="post" th:action="@{/deposit/{id}/cancel(id=${deposit.id})}" data-confirm="Bạn muốn hủy yêu cầu nạp tiền này? Thao tác này không tạo giao dịch hoàn tiền."><button type="submit" class="btn btn-outline">Hủy yêu cầu</button></form></section><aside class="deposit-aside"><div class="deposit-info"><h3>Thông tin yêu cầu</h3><p>Yêu cầu được tiếp nhận để xem xét. Trạng thái xác nhận không đồng nghĩa với việc số dư đã được cộng. Hệ thống chưa hỗ trợ tự ghi có ví.</p><a th:href="@{/support}">Trao đổi với đội ngũ hỗ trợ →</a></div><a class="deposit-home" th:href="@{/}">← Về trang chủ</a></aside></div></main></body></html>
